<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieTime - منصة أفلام</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
    }
    header {
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(135deg, #4a0000, #000000);
    }
    h1 {
      font-size: 3.5rem;
      margin-bottom: 8px;
      color: #ff0000;
    }
    .subtitle {
      font-size: 1.3rem;
      color: #aaa;
    }
    .search-container {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
    }
    #search {
      width: 100%;
      padding: 18px 25px;
      border: none;
      border-radius: 50px;
      background: #1f1f1f;
      color: white;
      font-size: 1.1rem;
    }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      padding: 30px 20px;
    }
    .movie-card {
      background: #161616;
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.4s;
      border: 1px solid #333;
    }
    .movie-card:hover {
      transform: translateY(-12px);
      border-color: #ff0000;
      box-shadow: 0 20px 40px rgba(255, 0, 0, 0.2);
    }
    .movie-card img {
      width: 100%;
      height: 420px;
      object-fit: cover;
    }
    .card-body {
      padding: 18px;
    }
    .card-body h3 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .category {
      display: inline-block;
      background: #c00;
      color: white;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .date {
      color: #888;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #ff0000;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #ff3333;
    }
  </style>
</head>
<body>

  <header>
    <h1>MovieTime</h1>
    <p class="subtitle">تابع أحدث الأفلام القادمة والتريلرات</p>
  </header>

  <div class="search-container">
    <input type="text" id="search" placeholder="ابحث عن فيلم...">
  </div>

  <div class="movies-grid" id="moviesGrid"></div>

  <script>
    const movies = [
      {
        title: "Dune: Part Two",
        date: "2026-06-11",
        image: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba",
        category: "Sci-Fi"
      },
      {
        title: "Batman Beyond",
        date: "2026-08-02",
        image: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c",
        category: "Action"
      },
      {
        title: "Avengers Reborn",
        date: "2026-10-18",
        image: "https://images.unsplash.com/photo-1513106580091-1d82408b8cd6",
        category: "Marvel"
      },
      {
        title: "The Batman 2",
        date: "2026-10-03",
        image: "https://images.unsplash.com/photo-1635805737707-575885ab0820",
        category: "DC"
      }
    ];

    function renderMovies(filteredMovies) {
      const container = document.getElementById('moviesGrid');
      container.innerHTML = '';

      filteredMovies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="\( {movie.image}" alt=" \){movie.title}">
          <div class="card-body">
            <span class="category">${movie.category}</span>
            <h3>${movie.title}</h3>
            <p class="date">موعد الإصدار: ${movie.date}</p>
            <button onclick="alert('▶️ سيتم تشغيل تريلر ${movie.title} قريباً!')">مشاهدة التريلر</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // عرض الأفلام
    renderMovies(movies);

    // البحث الديناميكي
    document.getElementById('search').addEventListener('keyup', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = movies.filter(movie => 
        movie.title.toLowerCase().includes(term)
      );
      renderMovies(filtered);
    });
  </script>

</body>
</html>
